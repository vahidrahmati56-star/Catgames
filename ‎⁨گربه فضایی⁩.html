<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گربه فضایی</title>
<style>
:root{--bg:#1b1464;--bg2:#5b2a9e;--ink:#fff;--y:#ffd93d;--p:#ff6bd6;--c:#4de1ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 20%,var(--bg2),var(--bg));font-family:Tahoma,"Vazirmatn",sans-serif;color:var(--ink);overflow:hidden;touch-action:none;user-select:none}
#app{position:relative;height:100%;max-width:520px;margin:auto}
canvas{width:100%;height:100%;display:block}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(20,10,70,.82);padding:16px;overflow:auto}
.scr.on{display:flex}
h1{font-size:46px;margin:0;color:var(--y);text-shadow:0 4px 0 #d9468f,0 8px 0 rgba(0,0,0,.3)}
.cat{font-size:80px;animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(6deg)}}
button,input{font:inherit;border-radius:30px;border:4px solid #fff;padding:10px 26px;font-size:20px}
button{background:linear-gradient(#ff8a5c,#ff3d8b);color:#fff;font-weight:bold;box-shadow:0 6px 0 #a3125a;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a3125a}
button.s{background:linear-gradient(#4de1ff,#3b82f6);box-shadow:0 6px 0 #1d4ed8;font-size:16px;padding:6px 18px}
input{background:#fff;color:#222;text-align:center;width:220px}
#hud{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:6px 14px;font-weight:bold;font-size:18px;pointer-events:none;text-shadow:0 2px 0 #000}
#mute{position:absolute;bottom:8px;left:8px;background:#0006;border:0;box-shadow:none;font-size:20px;padding:4px 10px;z-index:5}
table{border-collapse:collapse;width:90%;max-width:340px;background:#0004;border-radius:14px}
td{padding:6px 10px;border-bottom:1px solid #fff3}
tr.me td{color:var(--y);font-weight:bold}
.hint{font-size:14px;opacity:.85}
</style></head><body><div id="app">
<canvas id="c"></canvas>
<div id="hud"><span id="sc">⭐ 0</span><span id="lv">مرحله ۱</span><span id="sh"></span></div>
<button id="mute" title="صدا">🔊</button>

<div class="scr on" id="s-name"><div class="cat">🐱</div><h1>گربه فضایی</h1>
<div>اسمت چیه فضانورد؟</div><input id="nm" maxlength="14" placeholder="اسم شما"><button id="nmb">ثبت</button></div>

<div class="scr" id="s-start"><div class="cat">🐱🚀</div><h1>گربه فضایی</h1>
<div class="hint">ستاره جمع کن ⭐ از شهاب‌سنگ فرار کن ☄️<br>با کلید جهت‌ها / WASD یا کشیدن انگشت حرکت کن</div>
<button id="go">شروع بازی</button><button class="s" id="lb1">🏆 رکوردها</button></div>

<div class="scr" id="s-over"><h1 style="font-size:38px">Game Over</h1><div class="cat" style="font-size:60px">😿</div>
<div style="font-size:24px">امتیاز نهایی: <b id="fs" style="color:var(--y)">0</b></div><div id="rec"></div>
<button id="again">دوباره بازی کن</button><button class="s" id="lb2">🏆 رکوردها</button></div>

<div class="scr" id="s-lb"><h1 style="font-size:34px">🏆 رکوردها</h1><div id="lbbox">...</div><button id="back">بازگشت</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d');
const W=400,H=640;let sc,lvl,cat,items,t,run,shield,combo,keys={},spawnT,dpr;
function fit(){dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr}
addEventListener('resize',fit);fit();
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id))}
// ---- storage / identity ----
let name=null,myId=null,db=null,best=0,local={};
try{name=localStorage.getItem('sc_name');best=+localStorage.getItem('sc_best')||0}catch(e){}
(async()=>{try{const u=await claude.use('user');myId=u?await u.id():null;db=await claude.use('db');}catch(e){}})();
function toStart(){show('s-start')}
if(name)toStart();
$('nmb').onclick=()=>{const v=$('nm').value.trim();if(!v)return;name=v;try{localStorage.setItem('sc_name',v)}catch(e){}toStart()};
async function saveScore(s){
  if(s>best){best=s;try{localStorage.setItem('sc_best',best)}catch(e){}}
  if(!db||!myId)return;
  try{const r=db.collection('scores').doc(myId);const d=await r.get();
    if(!d.exists||(d.data().best||0)<s)await r.set({name,best:s});}catch(e){}
}
async function showLB(){
  show('s-lb');const b=$('lbbox');b.textContent='...';
  if(!db){b.textContent='جدول رکوردها فقط در لینک اشتراکی فعال است. رکورد شما: '+best;return}
  try{const q=await db.collection('scores').orderBy('best','desc').limit(10).get();
    if(q.empty){b.textContent='هنوز رکوردی ثبت نشده!';return}
    const tb=document.createElement('table');
    q.docs.forEach((d,i)=>{const v=d.data(),tr=document.createElement('tr');if(d.id==myId)tr.className='me';
      [['🥇','🥈','🥉'][i]||i+1,v.name||'؟',v.best].forEach(z=>{const td=document.createElement('td');td.textContent=z;tr.appendChild(td)});tb.appendChild(tr)});
    b.replaceChildren(tb);
  }catch(e){b.textContent='خطا در دریافت رکوردها'}
}
$('lb1').onclick=$('lb2').onclick=showLB;
$('back').onclick=()=>show(run===false&&sc>0?'s-over':'s-start');
// ---- music (original synth tunes) ----
let ac,mute=false,mt=null;
function tone(f,d,tp,v,at){const o=ac.createOscillator(),g=ac.createGain();o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+d)}
function play(seq,step,tp,loop){clearInterval(mt);if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  let i=0;const n=()=>{const f=seq[i%seq.length];if(f)tone(f,step*.9,tp,.08,ac.currentTime);i++;if(!loop&&i>=seq.length)clearInterval(mt)};n();mt=setInterval(n,step*1000)}
const N={C:262,D:294,E:330,F:349,G:392,A:440,B:494,c:523,d:587,e:659,g:784};
const happy=[N.C,N.E,N.G,N.c,N.G,N.E,N.D,N.F,N.A,N.d,N.A,N.F,N.E,N.G,N.c,N.e,N.d,N.B,N.G,0];
const sad=[N.A,N.c,N.e,N.d,N.c,N.B,N.A,N.G,N.F,N.E,N.D,N.C,0,0];
$('mute').onclick=()=>{mute=!mute;$('mute').textContent=mute?'🔇':'🔊';if(mute)clearInterval(mt);else if(run)play(happy,.2,'square',true)};
// ---- game ----
function start(){sc=0;lvl=1;t=0;combo=0;shield=0;spawnT=0;items=[];cat={x:W/2,y:H-90,r:22};run=true;show('');play(happy,.2,'square',true);hud()}
function hud(){$('sc').textContent='⭐ '+sc+(combo>2?' ×'+Math.min(combo,5):'');$('lv').textContent='مرحله '+lvl;$('sh').textContent=shield>0?'🛡️ '+Math.ceil(shield):''}
function spawn(){
  const r=Math.random(),sp=110+lvl*22+Math.random()*60,X=30+Math.random()*(W-60);
  let o={x:X,y:-30,vy:sp,r:16,k:'star',e:'⭐'};
  const mt_=Math.min(.38+lvl*.04,.62);
  if(r<mt_){o.k='met';o.e='☄️';o.r=19;o.vy=sp*1.1;if(lvl>=2&&Math.random()<.4){o.zig=1;o.e='🪨';o.ph=Math.random()*6}if(lvl>=3&&Math.random()<.25){o.x=cat.x;}if(Math.random()<.2){o.r=28;o.big=1}}
  else if(r<mt_+.07){o.k='gold';o.e='🌟';o.vy=sp*1.5}
  else if(r<mt_+.10){o.k='sh';o.e='🛡️'}
  else if(r<mt_+.12){o.k='slow';o.e='🐌'}
  items.push(o)}
let slow=0,last=0;
function step(dt){
  t+=dt;const nl=1+Math.floor(t/18);if(nl>lvl){lvl=nl;flash=1}
  const s=300*dt;
  if(keys.ArrowLeft||keys.a)cat.x-=s;if(keys.ArrowRight||keys.d)cat.x+=s;
  if(keys.ArrowUp||keys.w)cat.y-=s;if(keys.ArrowDown||keys.s)cat.y+=s;
  if(drag){cat.x+=(drag.x-cat.x)*Math.min(1,dt*14);cat.y+=(drag.y-cat.y)*Math.min(1,dt*14)}
  cat.x=Math.max(cat.r,Math.min(W-cat.r,cat.x));cat.y=Math.max(60,Math.min(H-cat.r,cat.y));
  if(shield>0)shield-=dt;if(slow>0)slow-=dt;
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.28,.8-lvl*.07)*(Math.random()*.6+.7);if(lvl>=4&&Math.random()<.3)spawn()}
  const f=slow>0?.5:1;
  for(const o of items){o.y+=o.vy*dt*f;if(o.zig){o.ph+=dt*3;o.x+=Math.sin(o.ph)*140*dt}
    if(Math.hypot(o.x-cat.x,o.y-cat.y)<o.r+cat.r-4){o.dead=1;
      if(o.k=='met'){if(shield>0){shield=0;pop(o.x,o.y,'💥')}else return die()}
      else if(o.k=='star'){combo++;sc+=10*Math.min(combo,5);pop(o.x,o.y,'+')}
      else if(o.k=='gold'){combo++;sc+=50;pop(o.x,o.y,'+50')}
      else if(o.k=='sh'){shield=8}else if(o.k=='slow'){slow=5}
      hud();if(o.k!='met'&&!(sc%10))ping()}
    else if(o.y>H+40){if(o.k=='star'||o.k=='gold')combo=0;o.dead=1}}
  items=items.filter(o=>!o.dead);parts=parts.filter(p=>(p.l-=dt)>0);parts.forEach(p=>p.y-=40*dt);hud()}
let parts=[],flash=0,drag=null;
function pop(X,Y,tx){parts.push({x:X,y:Y,t:tx,l:.6})}
function ping(){if(mute||!ac)return;tone(880,.1,'sine',.06,ac.currentTime)}
function die(){run=false;clearInterval(mt);saveScore(sc);$('fs').textContent=sc;
  $('rec').textContent=sc>=best&&sc>0?'🎉 رکورد جدید!':'رکورد شما: '+best;show('s-over');
  if(!mute){setTimeout(()=>play(sad,.42,'triangle',false),150)}}
const stars=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5}));
function draw(){
  x.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  // keep aspect: letterbox by scale uniform
  const k=Math.min(cv.width/W,cv.height/H);x.setTransform(k,0,0,k,(cv.width-W*k)/2,(cv.height-H*k)/2);
  x.clearRect(-1000,-1000,3000,3000);
  stars.forEach(s=>{s.y+=s.s*.3;if(s.y>H)s.y=0;x.fillStyle='#fff8';x.beginPath();x.arc(s.x,s.y,s.s,0,7);x.fill()});
  x.textAlign='center';x.textBaseline='middle';
  if(!cat)return;
  items.forEach(o=>{x.font=o.r*2+'px serif';x.fillText(o.e,o.x,o.y)});
  if(shield>0){x.strokeStyle='#4de1ff';x.lineWidth=4;x.beginPath();x.arc(cat.x,cat.y,cat.r+10,0,7);x.stroke()}
  x.font='46px serif';x.fillText('🐱',cat.x,cat.y);
  x.fillStyle='#4de1ff55';x.beginPath();x.arc(cat.x,cat.y-2,26,0,7);x.fill();
  x.font='22px serif';x.fillText('🔥',cat.x,cat.y+30+Math.sin(t*30)*3);
  x.font='bold 20px Tahoma';x.fillStyle='#ffd93d';parts.forEach(p=>x.fillText(p.t,p.x,p.y));
  if(flash>0){x.fillStyle='#ff6bd6';x.font='bold 36px Tahoma';x.globalAlpha=Math.min(1,flash);x.fillText('مرحله '+lvl+'!',W/2,H/2);x.globalAlpha=1;flash-=.016}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(run)step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// ---- input ----
addEventListener('keydown',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=0});
function pt(e){const r=cv.getBoundingClientRect(),k=Math.min(r.width/W,r.height/H);
  return{x:(e.clientX-r.left-(r.width-W*k)/2)/k,y:(e.clientY-r.top-(r.height-H*k)/2)/k-40}}
cv.addEventListener('pointerdown',e=>{drag=pt(e)});
cv.addEventListener('pointermove',e=>{if(drag)drag=pt(e)});
addEventListener('pointerup',()=>drag=null);
$('go').onclick=$('again').onclick=start;
</script></body></html>
